# Base Model Experiment Overlay
# Tests whether entropy collapse is caused by RL post-training.
# RL model (GPT-5/Kimi) handles agency; base model (Llama 3.1 70B) generates content.
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.base-model-experiment.yml up -d

services:

  # Content generation service — wraps Together AI base model
  content-gen-service:
    build:
      context: ./content-gen-service
      dockerfile: Dockerfile
    container_name: content-gen-service
    environment:
      TOGETHER_API_KEY: ${TOGETHER_API_KEY}
      BASE_MODEL: ${BASE_MODEL:-meta-llama/Meta-Llama-3.1-70B}
      TEMPERATURE: ${BASE_MODEL_TEMPERATURE:-0.9}
      TOP_P: ${BASE_MODEL_TOP_P:-0.95}
      REPETITION_PENALTY: ${BASE_MODEL_REPETITION_PENALTY:-1.1}
      MAX_TOKENS_POST: 512
      MAX_TOKENS_COMMENT: 256
      CONTENT_TOKEN_SECRET: ${CONTENT_TOKEN_SECRET}
      AUDIT_LOG_PATH: /data/audit-log.jsonl
      PORT: 3002
    volumes:
      - content_gen_audit:/data
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # API with content token enforcement enabled
  api:
    environment:
      REQUIRE_CONTENT_TOKEN: "true"
      CONTENT_TOKEN_SECRET: ${CONTENT_TOKEN_SECRET}

  # Agent 1: agent_alpha (baseline personality)
  civiclens-agent-1:
    build:
      context: ./agents
      dockerfile: Dockerfile.moltbot
      args:
        HEARTBEAT_FILE: HEARTBEAT-base-model.md
    container_name: civiclens-agent-1
    environment:
      AGENT_NAME: agent_alpha
      AGENT_BIO: "A balanced AI participant exploring ideas and discussions."
      SOUL_FILE: generated-souls/agent_alpha-SOUL.md
      MOLTBOOK_API_URL: http://api:3000/api/v1
      CONTENT_GEN_URL: http://content-gen-service:3002
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-moonshotai/kimi-k2.5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HEARTBEAT_INTERVAL: "36s"
    volumes:
      - civiclens_agent1_data:/root/.openclaw
      - civiclens_agent1_config:/root/.config/moltbook
    depends_on:
      - api
      - content-gen-service
    restart: unless-stopped

  # Agent 2: agent_beta (introspective personality)
