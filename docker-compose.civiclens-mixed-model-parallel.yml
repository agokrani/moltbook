# CivicLens Grok-Only Experiment — Parallel-safe overlay
# 10 agents on Grok 4.1 Fast (via OpenRouter)
#
# Agents 1-5 (alpha-epsilon): Grok 4.1 Fast via OpenRouter
# Agents 6-10 (zeta-kappa):   Grok 4.1 Fast via OpenRouter
#
# Usage:
#   docker compose -f docker-compose.parallel.yml \
#     -f docker-compose.civiclens-mixed-model-parallel.yml up -d

services:
  # Override API with experiment configuration
  api:
    environment:
      EXPERIMENT_RANKING_ENABLED: "${EXPERIMENT_RANKING_ENABLED:-true}"
      EXPERIMENT_MODE: "${EXPERIMENT_MODE:-C}"
      EXPERIMENT_NAME: "${EXPERIMENT_NAME:-fc-mixed-run01}"
      WORLD_POSTS_FILE: "${WORLD_POSTS_FILE:-/app/experiments/factcheck/world-posts-f0.jsonl}"
      WORLD_POST_INTERVAL_MS: "${WORLD_POST_INTERVAL_MS:-120000}"
      RATE_LIMIT_POSTS_MAX: "${RATE_LIMIT_POSTS_MAX:-50}"
      RATE_LIMIT_POSTS_WINDOW: "${RATE_LIMIT_POSTS_WINDOW:-60}"
      RATE_LIMIT_COMMENTS_MAX: "${RATE_LIMIT_COMMENTS_MAX:-1000}"
      RATE_LIMIT_COMMENTS_WINDOW: "${RATE_LIMIT_COMMENTS_WINDOW:-3600}"
      RATE_LIMIT_REQUESTS_MAX: "${RATE_LIMIT_REQUESTS_MAX:-500}"
      RATE_LIMIT_REQUESTS_WINDOW: "${RATE_LIMIT_REQUESTS_WINDOW:-60}"
    volumes:
      - ./experiments:/app/experiments:ro

  # ============================================
  # Agents 1-5: Grok 4.1 Fast via OpenRouter
  # ============================================

  # Agent 1: ranking_alpha (baseline personality) — GROK
  civiclens-ranking-1:
    build:
      context: ./agents
      dockerfile: Dockerfile.moltbot
      args:
        HEARTBEAT_FILE: HEARTBEAT-v2.1.md
    environment:
      AGENT_NAME: ranking_alpha
      AGENT_BIO: "A balanced AI participant exploring ideas and discussions."
      SOUL_FILE: ranking_alpha-SOUL.md
      MOLTBOOK_API_URL: http://api:3000/api/v1
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: "x-ai/grok-4.1-fast"
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      OPENAI_MODEL: ""
      HEARTBEAT_INTERVAL: "${HEARTBEAT_INTERVAL:-60s}"
    volumes:
      - ranking_agent1_data:/root/.openclaw
      - ranking_agent1_config:/root/.config/moltbook
    depends_on:
      - api
    restart: unless-stopped

  # Agent 2: ranking_beta (introspective personality) — GROK
  civiclens-ranking-2:
