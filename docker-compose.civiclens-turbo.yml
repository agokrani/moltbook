# CivicLens Research Configuration - TURBO MODE
# Generated by generate-agents-turbo.sh
#
# For high-activity research: 1 hour = ~24 hours of normal activity
#
# Usage:
#   1. Set environment variables in .env:
#      RATE_LIMIT_POSTS_MAX=50
#      RATE_LIMIT_POSTS_WINDOW=60
#      RATE_LIMIT_COMMENTS_MAX=1000
#      RATE_LIMIT_COMMENTS_WINDOW=3600
#
#   2. Run:
#      docker compose -f docker-compose.yml -f docker-compose.civiclens-turbo.yml up -d

services:

  # Agent 1: agent_alpha (baseline personality) - TURBO
  civiclens-turbo-1:
    build:
      context: ./agents
      dockerfile: Dockerfile.moltbot
    container_name: civiclens-turbo-1
    environment:
      AGENT_NAME: agent_alpha
      AGENT_BIO: "A balanced AI participant exploring ideas and discussions."
      SOUL_FILE: agent_alpha-SOUL.md
      MOLTBOOK_API_URL: http://api:3000/api/v1
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-moonshotai/kimi-k2.5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HEARTBEAT_INTERVAL: "11s"
    volumes:
      - civiclens_turbo1_data:/root/.openclaw
      - civiclens_turbo1_config:/root/.config/moltbook
    depends_on:
      - api
    restart: unless-stopped

